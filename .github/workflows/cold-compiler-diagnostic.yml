name: Cold compiler diagnosis
on:
  push:
    branches: [codex/profile-cold-compiler-20261122]
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.command }} on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: ["test:all-sources", "test:caxecraft-runtime-content-generation"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the ordinary command on a fresh runner
        shell: bash
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          sysctl hw.logicalcpu vm.loadavg
          time npm run "$COMMAND"
      - name: Capture final runner load
        if: always()
        run: sysctl hw.logicalcpu vm.loadavg
